services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: oj
      POSTGRES_PASSWORD: oj
      POSTGRES_DB: oj
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oj -d oj"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: oj
      RABBITMQ_DEFAULT_PASS: oj
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oj
      SPRING_DATASOURCE_USERNAME: oj
      SPRING_DATASOURCE_PASSWORD: oj
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: oj
      SPRING_RABBITMQ_PASSWORD: oj
      SPRING_DATA_REDIS_HOST: redis
      APP_CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"

  judge:
    profiles: ["full"]
    build:
      context: .
      dockerfile: services/judge/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oj
      SPRING_DATASOURCE_USERNAME: oj
      SPRING_DATASOURCE_PASSWORD: oj
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: oj
      SPRING_RABBITMQ_PASSWORD: oj
      SPRING_DATA_REDIS_HOST: redis
      APP_SANDBOX_WORKDIR: /tmp/oj-sandbox
      APP_SANDBOX_USE_DOCKER: "false"
    # Process sandbox default (python3/g++/javac in image). Docker sandbox is experimental on the host.

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: ""
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
