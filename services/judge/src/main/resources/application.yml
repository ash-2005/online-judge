spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://localhost:5432/oj?options=-c%20TimeZone=UTC
    username: oj
    password: oj
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: localhost
    port: 5672
    username: oj
    password: oj
  data:
    redis:
      host: localhost
      port: 6379

app:
  queues:
    practice: oj.judge.practice
    war: oj.judge.war
  sandbox:
    workdir: ${java.io.tmpdir}/oj-sandbox
    # false = process sandbox (default, supported). true = experimental docker run
    use-docker: false
    docker:
      java-image: eclipse-temurin:21-jdk
      python-image: python:3.12-slim
      cpp-image: gcc:13

logging:
  level:
    com.oj.judge: INFO
